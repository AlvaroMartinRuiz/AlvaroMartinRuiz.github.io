{{ define "main" }}
<div class="max-w-3xl mx-auto px-4 py-24 sm:py-32 text-center reveal">
  <p class="text-7xl sm:text-8xl font-extrabold tracking-tight bg-gradient-to-tr from-blue-500 to-cyan-400 bg-clip-text text-transparent mb-4 mt-0">404</p>
  <h1 class="text-2xl font-bold mt-0 mb-3">Page not found</h1>
  <p class="text-stone-500 dark:text-stone-400 mb-8 mt-0">The page you're looking for doesn't exist or may have moved.</p>
  <div class="flex gap-3 justify-center flex-wrap">
    <a href="{{ .Site.BaseURL }}" class="cv-btn"><i class="bi bi-house"></i> Home</a>
    <a href="{{ `projects` | relURL }}" class="social-btn-wide"><i class="bi bi-kanban"></i> Projects</a>
  </div>
</div>
{{ end }}
