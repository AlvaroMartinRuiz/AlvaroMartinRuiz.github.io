baseURL: "https://AlvaroMartinRuiz.github.io/"
languageCode: en-us
build:
  writeStats: true
title: Alvaro Martin Ruiz | Portfolio
# Uncomment below to use aafu as hugo theme. See instructions in README.md
theme: aafu
# Skip the theme's demo content (sample posts + Pagefind search page)
ignoreFiles: ["markdown_syntax/.*", "post_3\\.md", "search/_index\\.md"]
disableHugoGeneratorInject: true
disableKinds: ["taxonomy", "term"]

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ["$$", "$$"]
            - ["\\[", "\\]"]
          inline:
            - ["$", "$"]
            - ["\\(", "\\)"]
  highlight:
    style: github-dark
    noClasses: true
    lineNos: false
    tabWidth: 2
  tableOfContents:
    startLevel: 2
    endLevel: 3

params:
  author: Álvaro Martín Ruiz
  description: "Álvaro Martín Ruiz — final-year Data Science & Telecommunications Engineering student at UC3M, building at the intersection of machine learning and financial markets."
  copyright: ""
  theme:
    mainTheme: dark
    showAttribute: true
    singlePage: false
